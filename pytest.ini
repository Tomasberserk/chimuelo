[pytest]
# Directorio raíz de tests
testpaths = tests

# Nivel mínimo de logging capturado durante tests
log_cli = true
log_cli_level = WARNING

# Formato de reporte
addopts =
    --tb=short
    --strict-markers
    -v

# Markers propios del proyecto (declarar aquí evita warnings)
markers =
    integration: tests que requieren red real (excluir con -m "not integration")
    slow: tests lentos (excluir con -m "not slow")
